meters:
- name: worker_nodes
  description: Protected Kubernetes worker nodes, the primary ARMO Platform billing unit.
  unit: nodes
  aggregation: max
  dimensions:
  - account
  - cluster
- name: clusters
  description: Connected clusters under management.
  unit: clusters
  aggregation: max
  dimensions:
  - account
- name: self_hosted_compute
  description: Cluster compute for running the open-source Operator and scan jobs (no ARMO invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - cluster
principles:
- name: Visibility
  description: Track protected worker nodes and clusters per environment; on self-hosted, monitor Operator and scan-job compute cost.
- name: Allocation
  description: Map clusters and namespaces to teams so security spend aligns with owning cost centers.
- name: Optimization
  description: Right-size the Operator, scope scans to relevant namespaces/registries, and self-host the open-source tool where the managed per-node fee is not justified.
- name: Accountability
  description: Assign owners per cluster; review monthly node counts against the ARMO plan allowance or self-hosted compute budget.
