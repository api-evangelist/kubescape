description: >-
  FinOps view of Kubescape spend. The open-source Kubescape core (CLI plus
  in-cluster Operator, Apache 2.0, CNCF) is free - the cost is your own compute
  for running scans and the Operator's eBPF runtime monitoring, with no vendor
  invoice. ARMO Platform is the managed offering, billed primarily on the number
  of protected worker nodes (and, at larger scale, vCPUs and support tier),
  above a free node allowance. Enterprise agreements cover multi-cluster,
  multi-cloud deployments with extended retention and SLAs.
notes: >-
  ARMO Platform per-node rates are not reconciled here; verify on the ARMO
  pricing page. For self-hosted open-source deployments the dominant cost is the
  cluster compute for the Operator and scan jobs rather than any license fee.
