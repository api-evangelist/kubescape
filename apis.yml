- aid: kubescape:kubescape-in-cluster-component-api
  name: Kubescape In-Cluster Component API (Open Source)
  tags:
  - Kubernetes Security
  - Open Source
  - Operator
  - OpenAPI
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.armosec.io/blog/introducing-kubescape-open-api-framework/
  baseURL: http://<service-ip>:<service-port>
  properties:
  - url: https://www.armosec.io/blog/introducing-kubescape-open-api-framework/
    type: Documentation
  - url: https://kubescape.io/docs/operator/
    type: Documentation
  - url: https://github.com/kubescape
    type: SourceCode
  description: The open-source Kubescape Operator's in-cluster components (storage,
    kubevuln, gateway, operator, node-agent) each expose an OpenAPI/Swagger-documented
    HTTP API reachable inside the cluster at /openapi/v2/swaggerui, /openapi/v2/rapi,
    and /openapi/v2/docs. There is no hosted public endpoint - the base URL is the
    in-cluster Service address, so endpoints are modeled rather than called over a
    single fixed public host.
