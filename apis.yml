aid: kubescape
url: https://raw.githubusercontent.com/api-evangelist/kubescape/refs/heads/main/apis.yml
name: Kubescape
kind: organization
description: Kubescape is an open-source (Apache 2.0) Kubernetes security platform and
  CNCF incubating project, originally contributed by ARMO. It provides risk analysis,
  security and compliance posture scanning, misconfiguration detection, image and
  runtime vulnerability scanning, and eBPF-based runtime threat detection across the
  IDE, CI/CD pipelines, and live clusters. The core Kubescape is a CLI and an
  in-cluster Operator whose components expose OpenAPI/Swagger-documented HTTP APIs
  in-cluster (there is no single hosted public REST endpoint for the open-source
  tool). ARMO Platform is the commercial multi-cluster, multi-cloud SaaS built on
  Kubescape and exposes a documented hosted Customer API (base https://api.armosec.io)
  for posture, compliance, vulnerabilities, runtime incidents, attack paths, network
  policies, and registry/repository scanning, authenticated with an X-API-KEY access
  key.
